# config/pricing.yaml
# USD per million tokens, per canonical model id. Unknown models are never
# silently priced -- their tokens accumulate as "unpriced" in cost_report.
as_of: 2026-09-02
source: "Anthropic price list (platform.claude.com/docs/en/pricing)"

# Used when a usage record has no ephemeral_5m/1h cache-creation breakdown and
# only a flat cache_creation_input_tokens total.
default_cache_ttl: 5m

# Models whose tokens are always free (e.g. the router's own synthetic/test
# records), never counted as unpriced.
zero_cost_models:
  - "<synthetic>"

models:
  claude-fable-5-1:
